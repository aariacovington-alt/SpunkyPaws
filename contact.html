<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Contact Page</title>
    <link rel="stylesheet" href="style.css">
</head>

<body>

	<img src="spunkyPawsLogo.png" width="400px">

<div class="container">
    
    <div class="image-box"> </div>

    <div class="right">
        <h2>Join us</h2>

        <div class="form-card">
            <h3>Contact Form</h3>

            <div class="form-group">
                <label>Name</label>
                <input type="text">
            </div>

            <div class="form-group">
                <label>Email address</label>
                <input type="email">
            </div>

            <div class="form-group">
                <label>Leave a message</label>
                <textarea></textarea>
            </div>

            <button class="btn">Submit</button>
            <div class="small-text">We care about your privacy</div>
        </div>
    </div>
</div>

<div class="bottom">
    <h1>contact us!</h1>
    <p>Your paragraph text</p>
</div>

</body>
</html>
